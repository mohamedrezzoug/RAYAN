<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7a2fa0">
<meta name="description" content="عالم ريان: تطبيق تعليمي وترفيهي للأطفال بالعربية والفرنسية والإنجليزية">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>عالم ريان</title>
<style>
@font-face{font-family:'Cairo';src:url('fonts/Cairo.ttf') format('truetype');font-weight:200 1000;font-display:swap}
@font-face{font-family:'Lalezar';src:url('fonts/Lalezar.ttf') format('truetype');font-display:swap}
*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);height:100%}
body{margin:0;font-size:14px}
img{max-width:100%}
/* Layout: one-screen app — top bar, living cartoon stage (canvas), candy-button sheet at the bottom */
:root{
  --sky:#8fd3ff; --ink:#2b1d4a; --plum:#7a2fa0; --sun:#ffd23f; --rose:#ff5d8f; --leaf:#40c057;
  --sheet:#ffffff; --sheet-2:#f3edff; --muted:#6b5f86; --good:#2f9e44; --bad:#e03131;
  --display:'Lalezar','Cairo',system-ui,sans-serif; --body:'Cairo',system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--sky);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none}
#app{height:100%;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--plum);color:#fff;z-index:2}
.bar h1{font-family:var(--display);font-weight:400;font-size:clamp(22px,4vw,32px);margin:0;flex:1;line-height:1.1;text-wrap:balance}
.iconbtn{border:0;background:rgba(255,255,255,.18);color:#fff;width:44px;height:44px;border-radius:14px;font-size:24px;cursor:pointer;display:grid;place-items:center;font-family:var(--body)}
.iconbtn svg{width:24px;height:24px}
.bar{position:relative;z-index:30!important}
.langmenu{position:absolute;top:calc(100% + 6px);inset-inline-end:max(16px,env(safe-area-inset-right,0px));background:#fff;border-radius:18px;box-shadow:0 10px 30px rgba(43,29,74,.25);padding:6px;display:flex;flex-direction:column;gap:4px;z-index:20;min-width:160px}
.langmenu button{border:0;background:transparent;font-family:var(--body);font-weight:900;font-size:18px;color:var(--ink);padding:10px 14px;border-radius:12px;cursor:pointer;text-align:start}
.langmenu button:hover,.langmenu button:focus-visible{background:var(--sheet-2);outline:none}
.langmenu button[aria-current="true"]{background:var(--sun)}
.langbtn{width:auto;padding:0 12px;gap:6px;display:flex;font-weight:900;font-size:18px}
.iconbtn:focus-visible,.candy:focus-visible,.tile:focus-visible,.chip:focus-visible{outline:4px solid var(--sun);outline-offset:2px}
.stars{display:flex;align-items:center;gap:6px;background:var(--sun);color:var(--ink);border-radius:999px;padding:4px 14px 4px 10px;font-weight:900;font-size:20px;font-variant-numeric:tabular-nums}
.stars svg{width:24px;height:24px}
.stage{position:relative;flex:1;min-height:150px;overflow:hidden}
canvas#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.overlay{position:absolute;left:0;right:0;display:flex;justify-content:center;pointer-events:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hero{top:4%;flex-direction:column;align-items:center;text-align:center}
.hero .t1{font-family:var(--display);font-size:clamp(46px,10vw,104px);color:var(--sun);-webkit-text-stroke:3px var(--plum);paint-order:stroke fill;line-height:1;text-shadow:0 6px 0 rgba(122,47,160,.35)}
.hero .t2{font-weight:900;font-size:clamp(17px,3vw,26px);color:#fff;background:var(--rose);border-radius:999px;padding:2px 18px;margin-top:8px}
.lyric{bottom:12px}
.lyric div{background:rgba(43,29,74,.72);color:#fff;font-weight:900;font-size:clamp(20px,4.2vw,44px);padding:6px 26px;border-radius:999px;text-align:center;max-width:100%}
.lyric span{transition:color .15s}
.lyric span.on{color:var(--sun)}
.sheet{background:var(--sheet);border-radius:28px 28px 0 0;padding-block:16px 18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-shadow:0 -6px 0 rgba(43,29,74,.08);z-index:2;max-height:58%;overflow-y:auto}
.inner{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:640px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{border:0;border-radius:22px;padding:12px 10px 14px;cursor:pointer;color:#fff;font-family:var(--body);font-weight:900;font-size:clamp(16px,2.4vw,21px);display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 6px 0 rgba(0,0,0,.18);transition:transform .12s}
.tile:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.tile canvas{width:64px;height:64px}
.tile small{font-weight:700;font-size:13px;opacity:.92}
.candy{border:0;border-radius:18px;padding:10px 18px;font-family:var(--body);font-weight:900;font-size:18px;cursor:pointer;background:var(--sun);color:var(--ink);box-shadow:0 5px 0 #d9a300;transition:transform .1s}
.candy:active{transform:translateY(3px);box-shadow:0 2px 0 #d9a300}
.candy.alt{background:var(--sheet-2);box-shadow:0 5px 0 #d6c8f5}
.q{font-weight:900;font-size:clamp(19px,3.2vw,28px);text-align:center;margin:0;text-wrap:balance}
.answers{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:640px){.answers{grid-template-columns:repeat(2,1fr)}}
.ans{border:0;border-radius:20px;padding:8px 6px 10px;cursor:pointer;font-family:var(--body);font-weight:900;font-size:19px;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 5px 0 rgba(0,0,0,.15)}
.ans canvas{width:72px;height:72px}
.ans.ok{outline:5px solid var(--good)}
.ans.no{outline:5px solid var(--bad);animation:shake .4s}
.ans small{font-size:13px;font-weight:700;color:var(--muted)}
#s-home{max-height:72%}
.tiles.topics{grid-template-columns:repeat(6,1fr)}
@media (max-width:900px){.tiles.topics{grid-template-columns:repeat(4,1fr)}}
@media (max-width:560px){.tiles.topics{grid-template-columns:repeat(3,1fr)}}
.tile.topic{padding:10px 6px 12px;font-size:clamp(14px,2vw,18px);border-radius:20px;text-wrap:balance}
.tile.topic canvas{width:56px;height:56px}
.strip{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px}
.ichip{flex:0 0 auto;border:0;border-radius:16px;background:var(--sheet-2);padding:6px;cursor:pointer}
.ichip canvas{width:48px;height:48px;display:block}
.ichip.sel{background:var(--sun);outline:3px solid var(--plum)}
.ichip:focus-visible{outline:4px solid var(--sun)}
.tname{font-family:var(--display);font-size:clamp(30px,5vw,46px);color:var(--plum);margin:0;text-align:center;line-height:1.1}
.tdesc{margin:0;text-align:center;font-weight:700;font-size:clamp(16px,2.4vw,20px);color:var(--muted)}
.tcount{font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.ans.txt{font-size:clamp(20px,3vw,28px);min-height:76px;justify-content:center}
#vid{position:absolute;inset:0;width:100%;height:100%;background:#000;object-fit:contain;z-index:1}
.mlist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.mlist li{display:flex;gap:8px;align-items:center;background:var(--sheet-2);border-radius:16px;padding:6px}
.mlist li.cur{background:var(--sun)}
.mplay{flex:1;min-width:0;border:0;background:transparent;text-align:start;font-family:var(--body);font-weight:900;font-size:17px;color:var(--ink);cursor:pointer;padding:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mlist li.builtin{background:#ffe3ef}
.mtag{background:var(--rose);color:#fff;font-weight:900;font-size:13px;border-radius:999px;padding:4px 10px;margin-inline-end:6px}
.mlist li.sgames{background:transparent;padding:0 6px 6px;flex-wrap:wrap;gap:8px;margin-top:-4px}
.mdel{border:0;background:#fff;color:var(--bad);font-weight:900;border-radius:12px;padding:8px 12px;cursor:pointer;font-family:var(--body)}
.micbtn{width:120px;height:120px;border-radius:50%;border:0;background:var(--rose);color:#fff;box-shadow:0 8px 0 #c2255c;cursor:pointer;display:grid;place-items:center}
.micbtn svg{width:64px;height:64px}
.micbtn.rec,.micsmall.rec{background:var(--bad);color:#fff;animation:pulse 1s infinite}
.micsmall{display:flex;align-items:center;gap:6px}
.micsmall svg{width:22px;height:22px}
.micbtn:focus-visible,.mplay:focus-visible,.mdel:focus-visible{outline:4px solid var(--sun);outline-offset:2px}
@keyframes pulse{50%{transform:scale(1.07)}}
@media (prefers-reduced-motion:reduce){.micbtn.rec,.micsmall.rec{animation:none}}
#traceWrap{position:absolute;inset:0;background:#fff3d6;z-index:1}
#traceWrap canvas{position:absolute;left:8px;top:8px;width:calc(100% - 16px);height:calc(100% - 16px);object-fit:contain;touch-action:none}
.meter{height:14px;border-radius:999px;background:var(--sheet-2);overflow:hidden;max-width:520px;width:100%;margin:0 auto}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--sun),var(--leaf));transition:width .3s}
#paintWrap{position:absolute;inset:0;background:#fff3d6;z-index:1}
#paintWrap canvas{position:absolute;left:8px;top:8px;width:calc(100% - 16px);height:calc(100% - 16px);object-fit:contain;touch-action:none}
#tpl{pointer-events:none}
#s-draw{max-height:50%}
.memgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;max-width:640px;margin:0 auto;width:100%}
@media (max-width:640px){.memgrid{grid-template-columns:repeat(4,1fr)}}
.mcard{aspect-ratio:1;border:0;border-radius:16px;background:var(--sheet-2);position:relative;cursor:pointer;padding:0;display:grid;place-items:center;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.mcard canvas{width:72%;height:72%;opacity:0}
.mcard .mback{position:absolute;inset:0;border-radius:16px;background:var(--tc);color:#fff;font-family:var(--display);font-size:clamp(26px,5vw,40px);display:grid;place-items:center}
.mcard.open canvas{opacity:1}.mcard.open .mback{opacity:0}
.mcard.open{animation:flipin .28s}
.mcard.ok{outline:4px solid var(--good)}
.mcard:focus-visible,.swatch:focus-visible,.stamp:focus-visible,.tplb:focus-visible,.bsize:focus-visible,.thumb:focus-visible{outline:4px solid var(--sun);outline-offset:2px}
@keyframes flipin{0%{transform:scaleX(.05)}100%{transform:scaleX(1)}}
.swatch{width:40px;height:40px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #dee2e6;cursor:pointer;padding:0}
.swatch.sel,.stamp.sel,.bsize.sel,.tplb.sel,#eraser.sel{outline:4px solid var(--plum);outline-offset:2px}
.stamp,.tplb{border:0;background:var(--sheet-2);border-radius:12px;font-size:24px;width:46px;height:46px;cursor:pointer;padding:0}
.bsize{border:0;background:var(--sheet-2);border-radius:12px;width:46px;height:46px;display:grid;place-items:center;cursor:pointer}
.bsize i{display:block;border-radius:50%;background:var(--ink)}
.gallery{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.thumb{position:relative;flex:0 0 auto;border:0;padding:0;border-radius:12px;overflow:hidden;width:96px;height:60px;cursor:pointer;background:#fff;box-shadow:0 0 0 2px #dee2e6}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.tdel{position:absolute;top:2px;inset-inline-end:2px;background:var(--bad);color:#fff;border-radius:50%;width:22px;height:22px;display:grid;place-items:center;font-weight:900;font-size:14px}
.stkgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:8px}
@media (max-width:640px){.stkgrid{grid-template-columns:repeat(6,1fr)}}
.stk{aspect-ratio:1;border-radius:14px;background:var(--sheet-2);display:grid;place-items:center;font-size:clamp(22px,4vw,34px);opacity:.45}
.stk.got{opacity:1;background:#fff3bf}
.gatein{width:120px;font-size:24px;font-weight:900;text-align:center;border:3px solid #d6c8f5;border-radius:14px;padding:6px;font-family:var(--body);color:var(--ink);background:#fff}
@media (prefers-reduced-motion:reduce){.mcard.open{animation:none}}
#s-guide{max-height:72%}
.helpbtn{font-family:var(--display);font-size:26px;line-height:1}
.glist{list-style:none;margin:0;padding:0;display:grid;gap:10px}
@media (min-width:900px){.glist{grid-template-columns:1fr 1fr}}
.glist li{display:flex;gap:12px;align-items:flex-start;background:var(--sheet-2);border-radius:18px;padding:10px 14px}
.glist li>div:last-child{min-width:0}
.gic{flex:0 0 52px;height:52px;border-radius:14px;background:var(--plum);display:grid;place-items:center;font-size:28px}
.gic canvas{width:44px;height:44px}
.glist h3{margin:0;font-weight:900;font-size:18px;color:var(--plum)}
.glist p{margin:2px 0 0;font-weight:700;color:var(--ink);line-height:1.65;font-size:15px}
.bar h1{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:560px){.bar{gap:5px}.iconbtn{width:36px;height:36px;font-size:19px;border-radius:11px}.iconbtn svg{width:20px;height:20px}.helpbtn{font-size:21px}.langbtn{padding:0 7px;font-size:14px;gap:3px}.stars{padding:2px 9px 2px 7px;font-size:15px;gap:3px}.stars svg{width:18px;height:18px}.bar h1{font-size:17px}}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
.row{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.chip{border:0;border-radius:999px;padding:6px 16px 6px 10px;font-family:var(--body);font-weight:900;font-size:17px;cursor:pointer;display:flex;align-items:center;gap:6px;background:var(--sheet-2);color:var(--ink)}
.chip canvas{width:30px;height:30px}
.chip[aria-pressed="true"]{color:#fff}
.facts{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.facts li{background:var(--sheet-2);border-radius:16px;padding:8px 14px;font-weight:700;font-size:clamp(16px,2.4vw,20px);display:flex;gap:10px;align-items:center}
.facts li b{display:inline-grid;place-items:center;min-width:30px;height:30px;border-radius:50%;color:#fff;font-size:15px}
.months{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.months span{border:2px dashed var(--muted);border-radius:12px;padding:2px 12px;font-weight:700;color:var(--muted)}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:12px;height:12px;border-radius:50%;background:#e2d9f7}
.dots i.done{background:var(--sun)} .dots i.miss{background:#ffc9c9} .dots i.now{outline:3px solid var(--plum)}
.msg{min-height:30px;text-align:center;font-weight:900;font-size:19px;margin:0}
.msg.good{color:var(--good)} .msg.bad{color:var(--bad)}
.player{display:flex;gap:12px;align-items:center}
.player input{flex:1;min-width:0;accent-color:var(--rose);height:28px}
.player .time{font-variant-numeric:tabular-nums;font-weight:700;color:var(--muted);min-width:90px;text-align:center}
.play{width:64px;height:64px;border-radius:50%;padding:0;font-size:28px;display:grid;place-items:center}
.big{font-family:var(--display);font-size:clamp(34px,6vw,54px);color:var(--plum);text-align:center;margin:0;line-height:1.2}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 18px;border-radius:999px;font-weight:700;z-index:9;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:reduce){.tile,.candy{transition:none}.ans.no{animation:none}}
</style>
</head>
<body>

<div id="app" dir="rtl">
  <header class="bar">
    <button class="iconbtn" id="back" aria-label="رجوع" hidden>&#8594;</button>
    <h1 id="ttl">عالم ريان</h1>
    <button class="iconbtn helpbtn" id="helpBtn">?</button>
    <button class="iconbtn" id="parentBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><g fill="currentColor"><rect x="10.3" y="1.3" width="3.4" height="5" rx="1" transform="rotate(0 12 12)"/><rect x="10.3" y="1.3" width="3.4" height="5" rx="1" transform="rotate(45 12 12)"/><rect x="10.3" y="1.3" width="3.4" height="5" rx="1" transform="rotate(90 12 12)"/><rect x="10.3" y="1.3" width="3.4" height="5" rx="1" transform="rotate(135 12 12)"/><rect x="10.3" y="1.3" width="3.4" height="5" rx="1" transform="rotate(180 12 12)"/><rect x="10.3" y="1.3" width="3.4" height="5" rx="1" transform="rotate(225 12 12)"/><rect x="10.3" y="1.3" width="3.4" height="5" rx="1" transform="rotate(270 12 12)"/><rect x="10.3" y="1.3" width="3.4" height="5" rx="1" transform="rotate(315 12 12)"/><circle cx="12" cy="12" r="7"/></g><circle cx="12" cy="12" r="2.8" fill="#7a2fa0"/></svg></button>
    <button class="iconbtn" id="musBtn"></button>
    <button class="iconbtn langbtn" id="langBtn" aria-haspopup="true" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18" fill="none" stroke="currentColor" stroke-width="2"/></svg><span>FR</span></button>
    <div class="langmenu" id="langMenu" hidden><button data-l="ar" lang="ar">العربية</button><button data-l="fr" lang="fr">Français</button><button data-l="en" lang="en">English</button><button data-l="es" lang="es">Español</button></div>
    <div class="stars"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#ff8c00" d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7L12 17.3 5.8 21l1.6-7L2 9.2l7.1-.6z"/></svg><span id="starN">0</span></div>
  </header>

  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <video id="vid" playsinline controls hidden></video>
    <div id="traceWrap" hidden><canvas id="traceC"></canvas></div>
    <div id="paintWrap" hidden><canvas id="paint"></canvas><canvas id="tpl"></canvas></div>
    <div class="overlay hero" id="hero"><div class="t1" id="heroT1">عالم ريان</div><div class="t2" id="heroT2">نتعلّم ونلعب ونغنّي</div></div>
    <div class="overlay lyric" id="lyricWrap" hidden><div id="lyric" dir="rtl" lang="ar"></div></div>
  </div>

  <!-- HOME -->
  <section class="sheet" id="s-home">
    <div class="inner"><div class="tiles topics" id="topicGrid"></div></div>
  </section>

  <section class="sheet" id="s-hub" hidden>
    <div class="inner"><div class="tiles" id="hubModes"></div></div>
  </section>

  <section class="sheet" id="s-tlearn" hidden>
    <div class="inner">
      <p class="tname" id="tName"></p>
      <p class="tdesc" id="tDesc"></p>
      <div class="strip" id="itemStrip"></div>
      <div class="row"><button class="candy alt" id="tPrev">&#8594; السابق</button><button class="candy" id="tSay">استمع</button><button class="candy alt micsmall" id="tMic"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="2.5" width="6" height="11.5" rx="3" fill="currentColor"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg><span id="tMicTxt"></span></button><button class="candy alt" id="tNext">التالي &#8592;</button><span class="tcount" id="tCount"></span></div>
    </div>
  </section>

  <section class="sheet" id="s-songs" hidden>
    <div class="inner">
      <div class="row"><button class="candy" id="addSong"></button><input type="file" id="songFile" accept="audio/*" multiple hidden></div>
      <div class="player" id="songPlayer" hidden><button class="candy play" id="songPlay" aria-label="play">&#9654;</button><input type="range" id="songSeek" min="0" max="1" step="0.001" value="0" aria-label="seek"><span class="time" id="songTm">0:00</span></div>
      <ul class="mlist" id="songList"></ul>
      <p class="tdesc" id="songEmpty"></p>
    </div>
  </section>

  <section class="sheet" id="s-videos" hidden>
    <div class="inner">
      <div class="row"><button class="candy" id="addVideo"></button><input type="file" id="videoFile" accept="video/*" multiple hidden></div>
      <ul class="mlist" id="videoList"></ul>

const midi=n=>440*Math.pow(2,(n-69)/12);
function audioInit(){if(MUS.ctx)return;const A=window.AudioContext||window.webkitAudioContext;if(!A)return;try{const ac=new A();MUS.ctx=ac;
  MUS.master=ac.createGain();MUS.master.connect(ac.destination);MUS.music=ac.createGain();MUS.music.gain.value=MUS.on?.55:0;MUS.music.connect(MUS.master);
  MUS.sfx=ac.createGain();MUS.sfx.gain.value=.9;MUS.sfx.connect(MUS.master);
  const b=ac.createBuffer(1,ac.sampleRate*.3,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;MUS.noise=b;
  setInterval(sched,40);MUS.next=ac.currentTime+.1}catch(e){}}
function tone(f,t,d,type,g,dest){const ac=MUS.ctx,o=ac.createOscillator(),v=ac.createGain();o.type=type;o.frequency.value=f;let out=o;
  if(type==='square'){const fl=ac.createBiquadFilter();fl.type='lowpass';fl.frequency.value=1600;o.connect(fl);out=fl}
  v.gain.setValueAtTime(0,t);v.gain.linearRampToValueAtTime(g,t+.012);v.gain.exponentialRampToValueAtTime(.0008,t+d);out.connect(v).connect(dest||MUS.music);o.start(t);o.stop(t+d+.05)}
function noiseHit(t,g,ft,f,d){const ac=MUS.ctx,s=ac.createBufferSource(),fl=ac.createBiquadFilter(),v=ac.createGain();s.buffer=MUS.noise;fl.type=ft;fl.frequency.value=f;
  v.gain.setValueAtTime(g,t);v.gain.exponentialRampToValueAtTime(.0008,t+d);s.connect(fl).connect(v).connect(MUS.music);s.start(t);s.stop(t+d+.02)}
function kick(t){const ac=MUS.ctx,o=ac.createOscillator(),v=ac.createGain();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(45,t+.12);
  v.gain.setValueAtTime(.32,t);v.gain.exponentialRampToValueAtTime(.001,t+.2);o.connect(v).connect(MUS.music);o.start(t);o.stop(t+.22)}
function playStep(i,t,sd){const M=MOODS[MUS.mood],ch=M.prog[Math.floor(i/8)],n=M.mel[i];
  if(n!=null){tone(midi(M.base+n),t,sd*(M.box?3:1.7),M.wave,M.wave==='square'?.05:.09);if(M.box)tone(midi(M.base+n+12),t,sd*2,'sine',.025)}
  if(i%4===0)tone(midi(M.base-24+ch[0]),t,sd*3.6,'triangle',.13);
  if(M.pad&&i%8===0)ch.forEach(x=>tone(midi(M.base-12+x),t,sd*7.8,'sine',.022));
  if(M.drums){if(i%4===0)kick(t);if(i%2===1)noiseHit(t,.035,'highpass',7000,.04);if(M.snare&&i%8===4)noiseHit(t,.09,'bandpass',1800,.12)}}
function sched(){const ac=MUS.ctx;if(!ac||!MUS.mood)return;const M=MOODS[MUS.mood],sd=60/M.bpm/2;if(MUS.next<ac.currentTime)MUS.next=ac.currentTime+.05;
  while(MUS.next<ac.currentTime+.18){playStep(MUS.step,MUS.next,sd);MUS.next+=sd;MUS.step=(MUS.step+1)%32}}
function setMood(m){if(m===MUS.mood)return;MUS.mood=m;MUS.step=0;if(MUS.ctx)MUS.next=MUS.ctx.currentTime+.08}
function musicLevel(){if(MUS.music&&MUS.ctx)MUS.music.gain.setTargetAtTime(MUS.on?.55*MUS.duck:0,MUS.ctx.currentTime,.15)}
function toggleMusic(){audioInit();MUS.on=!MUS.on;try{localStorage.setItem('rayan_music',MUS.on?'on':'off')}catch(e){}musicLevel();paintMusicBtn()}

/* ---------- speech ---------- */
function speak(text){if(!('speechSynthesis' in window)){toast(T('noTTS'));return}
  const want=lang;const vs=speechSynthesis.getVoices().filter(v=>v.lang&&v.lang.toLowerCase().startsWith(want));if(!vs.length){toast(T('noVoice'));return}
  speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.voice=(want==='fr'?vs.find(v=>/FR/i.test(v.lang)):want==='en'?vs.find(v=>/GB|US/i.test(v.lang)):want==='es'?vs.find(v=>/ES|MX|US/i.test(v.lang)):vs.find(v=>/SA|EG|MA/i.test(v.lang)))||vs[0];u.lang=u.voice.lang;u.rate=.85;
  MUS.duck=.25;musicLevel();u.onend=u.onerror=()=>{MUS.duck=1;musicLevel()};speechSynthesis.speak(u)}

let tq=null;
function pickN(arr,n,not){return shuffle(arr.filter(x=>x!==not)).slice(0,n)}
function genQs(tp){const qs=[],used=new Set();for(let i=0;i<8;i++){const type=tp.qtypes[i%tp.qtypes.length];let pool=tp.items.filter(x=>!used.has(x)&&(type!=='count'||x.v>0));if(!pool.length)pool=tp.items.filter(x=>type!=='count'||x.v>0);
  const target=pool[Math.floor(Math.random()*pool.length)];used.add(target);let correct=target,text;
  if(type==='next'){correct=tp.items[(target.i+1)%7];text=T('nextDay',target.n)}
  else if(type==='count')text=T('countQ');else if(type==='find')text=tp.findQ(target);else if(type==='first')text=tp.firstQ(target);else text=tp.whatQ;
  const others=pickN(tp.items.filter(x=>(type!=='count'||x.v>0)&&(type!=='first'||x.k!==correct.k)),3,correct);qs.push({type,target,correct,text,opts:shuffle([correct,...others])})}return shuffle(qs)}
function startTQuiz(){tq={qs:genQs(curTopic),i:0,score:0,res:[],locked:false};showTQ()}
function showTQ(){const q=tq.qs[tq.i];tq.locked=false;$('tqText').textContent=q.text;$('tqMsg').textContent='';$('tqMsg').className='msg';tShow=now();

    if(q.type==='find'){b.style.background='#f3edff';const cc=document.createElement('canvas');iconCanvas(cc,()=>drawItem(curTopic,o,100,100,80,0),72);b.append(cc);b.setAttribute('aria-label',o.n)}
    else{b.classList.add('txt');b.style.background=['#ffd8a8','#c3fae8','#d0ebff','#fcc2d7'][oi];b.textContent=(q.type==='count'||q.type==='first')?o.k:o.n}
    b.onclick=()=>tAnswer(o,b);box.appendChild(b)})}
function tAnswer(o,b){if(tq.locked)return;const q=tq.qs[tq.i];
  if(o===q.correct){tq.locked=true;b.classList.add('ok');tq.res[tq.i]=tq.res[tq.i]!==false;if(tq.res[tq.i]){tq.score++;addStar()}
    $('tqMsg').textContent=praise();$('tqMsg').className='msg good';sfx(true);fx={start:now(),until:now()+1.6};kidFx.jump=now();
    setTimeout(()=>{tq.i++;if(tq.i>=tq.qs.length)finish(tq.score,tq.qs.length,curTopic.name);else showTQ()},1500)}
  else{b.classList.remove('no');void b.offsetWidth;b.classList.add('no');tq.res[tq.i]=false;$('tqMsg').textContent=T('wrong');$('tqMsg').className='msg bad';sfx(false)}}

const MEM=[];let _db=null,_dbFail=false;
function idb(){return new Promise((res,rej)=>{if(_db)return res(_db);if(_dbFail||!window.indexedDB)return rej();try{const r=indexedDB.open('rayan',1);r.onupgradeneeded=()=>r.result.createObjectStore('media',{keyPath:'id',autoIncrement:true});r.onsuccess=()=>{_db=r.result;res(_db)};r.onerror=()=>{_dbFail=true;rej()}}catch(e){_dbFail=true;rej()}})}

async function mediaGet(id){try{const db=await idb();return await new Promise(res=>{const r=db.transaction('media').objectStore('media').get(id);r.onsuccess=()=>res(r.result);r.onerror=()=>res(null)})}catch(e){return MEM.find(m=>m.id===id)}}
async function mediaAdd(file,kind){const rec={kind,name:file.name.replace(/\.[^.]+$/,''),type:file.type,blob:file,added:Date.now()};
  try{const db=await idb();await new Promise((res,rej)=>{const tx=db.transaction('media','readwrite');tx.objectStore('media').add(rec);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}catch(e){rec.id='m'+Date.now()+Math.random();MEM.push(rec);if(!_dbFail)toast(T('storeErr'))}}

function drawTpl(){tc.clearRect(0,0,PW,PH);if(TPL==='none')return;tc.strokeStyle='#868e96';tc.lineWidth=10;tc.lineJoin='round';tc.lineCap='round';const x=PW/2,y=PH/2;tc.beginPath();

  else if(TPL==='sun'){tc.arc(x,y,170,0,2*PI);for(let i=0;i<12;i++){const a=i*PI/6;tc.moveTo(x+220*Math.cos(a),y+220*Math.sin(a));tc.lineTo(x+330*Math.cos(a),y+330*Math.sin(a))}tc.moveTo(x-50,y-30);tc.arc(x-60,y-30,12,0,2*PI);tc.moveTo(x+70,y-30);tc.arc(x+60,y-30,12,0,2*PI);tc.moveTo(x-80,y+50);tc.quadraticCurveTo(x,y+120,x+80,y+50)}
  else if(TPL==='fish'){tc.ellipse(x-40,y,300,170,0,0,2*PI);tc.moveTo(x+250,y);tc.lineTo(x+430,y-150);tc.lineTo(x+430,y+150);tc.closePath();tc.moveTo(x-200,y-40);tc.arc(x-220,y-40,22,0,2*PI);tc.moveTo(x-60,y-160);tc.quadraticCurveTo(x+40,y-280,x+120,y-140)}

let PAR={limit:0,day:'',secs:0,extra:0};try{Object.assign(PAR,JSON.parse(localStorage.getItem('rayan_par')||'{}'))}catch(e){}
const today=()=>new Date().toISOString().slice(0,10);
function savePar(){try{localStorage.setItem('rayan_par',JSON.stringify(PAR))}catch(e){}}
function rolloverDay(){if(PAR.day!==today()){PAR.day=today();PAR.secs=0;PAR.extra=0;savePar()}}
function overLimit(){rolloverDay();return PAR.limit>0&&PAR.secs>=(PAR.limit+PAR.extra)*60}
let gateAns=0,gateNext='parent',beforeGate='home';
function openGate(){const a=3+Math.floor(Math.random()*6),b=3+Math.floor(Math.random()*6);gateAns=a*b;$('gateQ').textContent=T('gateQ',a,b);$('gateIn').value='';$('gateMsg').textContent='';beforeGate=mode==='gate'||mode==='parent'?beforeGate:mode;show('gate');setTimeout(()=>$('gateIn').focus(),50)}
$('gateOk').onclick=()=>{if(+$('gateIn').value===gateAns){buildParent();show('parent')}else{$('gateMsg').textContent=T('wrongGate');sfx(false)}};
$('gateIn').addEventListener('keydown',e=>{if(e.key==='Enter')$('gateOk').click()});
function buildParent(){rolloverDay();const box=$('limits');box.innerHTML='';[0,15,30,45,60,90].forEach(m=>{const b=document.createElement('button');b.className='chip';b.textContent=m?T('mins',m):T('noLimit');b.setAttribute('aria-pressed',String(PAR.limit===m));
  b.style.background=PAR.limit===m?'var(--plum)':'';b.style.color=PAR.limit===m?'#fff':'';b.onclick=()=>{PAR.limit=m;savePar();buildParent()};box.appendChild(b)});
  $('usedT').textContent=T('usedToday',Math.round(PAR.secs/60));$('limTitle').textContent=T('limitTitle');$('addTime').textContent=T('addTime');$('resetStars').textContent=T('resetStars');$('parDone').textContent=T('done2')}
$('addTime').onclick=()=>{PAR.extra+=15;savePar();toast('＋15');buildParent()};
$('resetStars').onclick=e=>{const b=e.currentTarget;if(b.dataset.sure){stars=0;seenStickers=0;TSTARS={};try{localStorage.setItem('rayan_stars',0);localStorage.setItem('rayan_seen',0);localStorage.setItem('rayan_tstars','{}')}catch(_){}$('starN').textContent=0;delete b.dataset.sure;buildParent()}else{b.dataset.sure='1';b.textContent=T('confirm');setTimeout(()=>{delete b.dataset.sure;b.textContent=T('resetStars')},2500)}};
$('parDone').onclick=()=>{if(overLimit())go('rest');else go(beforeGate==='rest'?'home':beforeGate)};
$('parentBtn').onclick=openGate;$('restParent').onclick=openGate;
setInterval(()=>{if(document.visibilityState!=='visible'||mode==='rest'||mode==='gate'||mode==='parent')return;rolloverDay();PAR.secs+=10;savePar();if(overLimit())go('rest')},10000);

const TS=1000,TQ=.25;const trC=$('traceC');trC.width=trC.height=TS;const trx=trC.getContext('2d');
const trM=document.createElement('canvas'),trS=document.createElement('canvas');trM.width=trM.height=trS.width=trS.height=TS*TQ;const mx=trM.getContext('2d'),sx=trS.getContext('2d');
let TR={i:0,down:false,last:null,hue:0,done:false,maskN:1};
const TRACE_COLS=['#e03131','#f76707','#f59f00','#2f9e44','#1c7ed6','#7048e8','#d6336c'];
function trFont(){return `${curTopic.kind==='digit'?620:640}px 'Lalezar','Cairo',sans-serif`}
function trGlyph(ctx,fill,stroke,dash,scale){const it=curTopic.items[TR.i];ctx.save();ctx.scale(scale,scale);ctx.font=trFont();ctx.textAlign='center';ctx.textBaseline='alphabetic';ctx.direction=curTopic.kind==='letter'&&lang==='ar'?'rtl':'ltr';
  const m=ctx.measureText(it.k);const y=TS/2+(m.actualBoundingBoxAscent-m.actualBoundingBoxDescent)/2+20;
  if(fill){ctx.fillStyle=fill;ctx.fillText(it.k,TS/2,y)}if(stroke){ctx.setLineDash(dash||[]);ctx.lineWidth=7;ctx.strokeStyle=stroke;ctx.lineJoin='round';ctx.strokeText(it.k,TS/2,y)}ctx.restore()}
async function startTrace(){TR.i=0;try{await document.fonts.load(trFont())}catch(e){}drawTraceBase()}
function drawTraceBase(){const it=curTopic.items[TR.i];TR.done=false;TR.hue=0;
  trx.setLineDash([]);trx.fillStyle='#ffffff';trx.fillRect(0,0,TS,TS);trGlyph(trx,'#f1f3f5','#adb5bd',[22,16],1);
  if(it.e){trx.save();trx.font='120px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';trx.textAlign='center';trx.textBaseline='middle';trx.fillText(it.e,TS-110,120);trx.restore()}
  mx.clearRect(0,0,TS*TQ,TS*TQ);trGlyph(mx,'#000',null,null,TQ);sx.clearRect(0,0,TS*TQ,TS*TQ);
  const d=mx.getImageData(0,0,TS*TQ,TS*TQ).data;let n=0;for(let i=3;i<d.length;i+=4)if(d[i]>100)n++;TR.maskN=Math.max(1,n);
  $('trText').textContent=curTopic.kind==='digit'?T('traceN',it):T('traceL',it);$('trCount').textContent=`${TR.i+1} / ${curTopic.items.length}`;$('trMeter').style.width='0%';$('trMsg').textContent='';$('trMsg').className='msg'}
function trPos(e){const r=trC.getBoundingClientRect(),s=Math.min(r.width/TS,r.height/TS),ox=(r.width-TS*s)/2,oy=(r.height-TS*s)/2;return{x:(e.clientX-r.left-ox)/s,y:(e.clientY-r.top-oy)/s}}
function trSeg(a,b){const col=TRACE_COLS[TR.hue%TRACE_COLS.length];trx.setLineDash([]);trx.lineCap=trx.lineJoin='round';trx.strokeStyle=col;trx.lineWidth=58;trx.beginPath();trx.moveTo(a.x,a.y);trx.lineTo(b.x+.01,b.y);trx.stroke();
  sx.lineCap='round';sx.strokeStyle='#000';sx.lineWidth=58*TQ;sx.beginPath();sx.moveTo(a.x*TQ,a.y*TQ);sx.lineTo(b.x*TQ+.01,b.y*TQ);sx.stroke()}
trC.addEventListener('pointerdown',e=>{if(TR.done)return;e.preventDefault();TR.down=true;TR.last=trPos(e);trC.setPointerCapture(e.pointerId);trSeg(TR.last,TR.last)});
trC.addEventListener('pointermove',e=>{if(!TR.down)return;const p=trPos(e);trSeg(TR.last,p);TR.last=p});
['pointerup','pointercancel'].forEach(ev=>trC.addEventListener(ev,()=>{if(!TR.down)return;TR.down=false;TR.hue++;trCheck()}));
function trCheck(){const m=mx.getImageData(0,0,TS*TQ,TS*TQ).data,s=sx.getImageData(0,0,TS*TQ,TS*TQ).data;let cov=0,out=0,sn=0;
  for(let i=3;i<m.length;i+=4){if(s[i]>100){sn++;if(m[i]>100)cov++;else out++}}
  const p=cov/TR.maskN,o=sn?out/sn:0;$('trMeter').style.width=Math.min(100,Math.round(p/.62*100))+'%';
  if(p>=.62&&o<.55){TR.done=true;trGlyph(trx,curTopic.col,'#ffffff',[],1);$('trMsg').textContent=praise();$('trMsg').className='msg good';sfx(true);addStar();
    setTimeout(()=>{if(mode!=='trace')return;if(TR.i<curTopic.items.length-1){TR.i++;drawTraceBase()}else finish(0,0,'',T('doneGood'))},1600)}
  else if(TR.hue>=4&&p<.62){$('trMsg').textContent=T('traceMore');$('trMsg').className='msg'}}
$('trWipe').onclick=()=>drawTraceBase();
$('trNext').onclick=()=>{TR.i=(TR.i+1)%curTopic.items.length;drawTraceBase()};
$('trSay').onclick=()=>{const it=curTopic.items[TR.i];speak(it.say||it.n)};
